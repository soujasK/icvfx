version: "3.8"

services:
  # 1. Mission Control Web Dashboard
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - telemetry-engine

  # 2. 120Hz FreeD UDP Receiver & 6-DoF EKF Engine
  telemetry-engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    ports:
      - "8080:8080"
      - "5005:5005/udp"
    env_file:
      - .env
    restart: unless-stopped

  # 3. Distributed Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "4L622nCwTKi0wHbQgvuOJg"
    restart: unless-stopped

  # 4. Prometheus Real-time Metric Scraper
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # 5. Grafana Stage Observability Portal
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./observability/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/alerting:/etc/grafana/provisioning/alerting
      - ./observability/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    depends_on:
      - prometheus
